<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrivStat · 数据目录</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #19342f; background: #f4f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 24px max(6vw, 24px); border-bottom: 1px solid #dce6e0; background: white; }
    .brand { font-weight: 750; font-size: 24px; letter-spacing: -.8px; }
    .brand span { color: #6a8077; margin-left: 16px; font-weight: 400; font-size: 14px; letter-spacing: 0; }
    main { max-width: 1000px; margin: 64px auto; padding: 0 24px; }
    .eyebrow { color: #547565; font-size: 12px; letter-spacing: 2px; }
    h1 { font-size: clamp(28px, 5vw, 40px); margin: 12px 0; }
    .intro { color: #64776e; line-height: 1.8; }
    #status { margin: 32px 0 16px; color: #536d61; font-size: 14px; }
    article, .panel { border: 1px solid #dce6e0; border-radius: 12px; padding: 28px; background: white; margin-bottom: 20px; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    article p { color: #64776e; line-height: 1.7; }
    .badge { display: inline-block; color: #236345; background: #edf7f0; padding: 5px 10px; border-radius: 6px; font-size: 12px; }
    .fields { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
    .fields code { background: #f4f7f5; border: 1px solid #e4eae6; border-radius: 5px; padding: 6px 10px; font-size: 13px; }
    footer { margin-top: 32px; color: #76847b; font-size: 13px; }
    .budget-stats { display: flex; flex-wrap: wrap; gap: 16px; }
    .budget-stats div { flex: 1; min-width: 140px; background: #f4f7f5; border: 1px solid #e4eae6; border-radius: 10px; padding: 16px; }
    .stat-label { display: block; color: #64776e; font-size: 13px; margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 700; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 18px 0; }
    label { display: block; color: #40544b; font-size: 13px; }
    input { width: 100%; margin-top: 6px; padding: 9px 10px; border: 1px solid #cfdbd4; border-radius: 8px; font: inherit; font-size: 14px; background: white; }
    input:focus { outline: 2px solid #9fc3b2; outline-offset: 1px; }
    button { margin-top: 4px; padding: 10px 22px; border: 0; border-radius: 8px; background: #236345; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #1b5037; }
    button:disabled { background: #9db3a8; cursor: wait; }
    #release-message { margin-top: 16px; font-size: 14px; line-height: 1.6; }
    #release-message.error { color: #9b2c2c; }
    #release-message.success { color: #236345; }
    .release-card { padding: 18px 20px; }
    .release-card h3 { margin: 0 0 8px; font-size: 16px; }
    .release-card dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px 18px; margin: 0; font-size: 13px; }
    .release-card dt { color: #76847b; }
    .release-card dd { margin: 0; color: #19342f; word-break: break-all; }
    .empty { color: #76847b; font-size: 14px; }
  </style>
</head>
<body>
  <header><div class="brand">PrivStat <span>本地数据目录</span></div></header>
  <main>
    <div class="eyebrow">DATA CATALOG</div>
    <h1>认识数据，从目录开始。</h1>
    <p class="intro">查看本地数据集的名称、说明与字段。此页面仅显示目录信息。</p>
    <div id="status" role="status" aria-live="polite">正在读取数据目录…</div>
    <section id="datasets" aria-label="数据集列表"></section>

    <section class="panel" aria-label="隐私预算">
      <div class="eyebrow">PRIVACY BUDGET</div>
      <h2>隐私预算</h2>
      <div class="budget-stats">
        <div><span class="stat-label">初始额度</span><span class="stat-value" id="budget-initial">–</span></div>
        <div><span class="stat-label">已用额度</span><span class="stat-value" id="budget-used">–</span></div>
        <div><span class="stat-label">剩余额度</span><span class="stat-value" id="budget-remaining">–</span></div>
      </div>
    </section>

    <section class="panel" aria-label="发布计数">
      <div class="eyebrow">RELEASE</div>
      <h2>发布差分隐私计数</h2>
      <p class="intro">对 retail-demo 数据集按筛选条件计数，加入 Laplace 噪声后发布。仅发布带噪声的总数，不涉及任何行级记录。</p>
      <form id="release-form">
        <div class="form-grid">
          <label>请求标识 request_id<input id="request-id" required></label>
          <label>隐私参数 ε（0.1–1.0）<input id="epsilon" type="number" min="0.1" max="1.0" step="0.1" value="0.5" required></label>
          <label>区域 region<input id="filter-region" placeholder="如 north，可留空"></label>
          <label>会员等级 membership<input id="filter-membership" placeholder="如 standard，可留空"></label>
          <label>年龄段 age_band<input id="filter-age_band" placeholder="如 18-29，可留空"></label>
          <label>到店频率 visit_bucket<input id="filter-visit_bucket" placeholder="如 regular，可留空"></label>
        </div>
        <button type="submit" id="publish-button">发布计数</button>
      </form>
      <div id="release-message" role="status" aria-live="polite"></div>
    </section>

    <section class="panel" aria-label="发布历史">
      <div class="eyebrow">HISTORY</div>
      <h2>发布历史</h2>
      <div id="releases"></div>
    </section>

    <footer>当前使用合成零售样例，不包含真实客户数据。</footer>
  </main>
  <script>
    const FILTER_FIELDS = ['region', 'membership', 'age_band', 'visit_bucket'];

    function newRequestId() {
      const suffix = crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : String(Date.now());
      return `req-${suffix}`;
    }

    async function loadCatalog() {
      const status = document.getElementById('status');
      const list = document.getElementById('datasets');
      try {
        const response = await fetch('/api/datasets');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const datasets = await response.json();
        status.textContent = `可用数据集 · ${datasets.length}`;
        for (const dataset of datasets) {
          const card = document.createElement('article');
          const title = document.createElement('h2');
          title.textContent = dataset.name;
          const description = document.createElement('p');
          description.textContent = dataset.description;
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = dataset.synthetic ? '合成数据' : '本地数据';
          const fields = document.createElement('div');
          fields.className = 'fields';
          for (const name of dataset.fields) {
            const field = document.createElement('code');
            field.textContent = name;
            fields.append(field);
          }
          card.append(title, description, badge, fields);
          list.append(card);
        }
      } catch (error) {
        status.textContent = `数据目录暂时不可用：${error.message}`;
      }
    }

    async function refreshBudget() {
      try {
        const response = await fetch('/api/privacy-budget');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const budget = await response.json();
        document.getElementById('budget-initial').textContent = budget.initial_budget;
        document.getElementById('budget-used').textContent = budget.used_budget;
        document.getElementById('budget-remaining').textContent = budget.remaining_budget;
      } catch (error) {
        for (const key of ['initial', 'used', 'remaining']) {
          document.getElementById(`budget-${key}`).textContent = '不可用';
        }
      }
    }

    function describeFilters(filters) {
      const entries = Object.entries(filters || {});
      if (!entries.length) return '（无筛选）';
      return entries.map(([field, value]) => `${field}=${value}`).join('，');
    }

    async function refreshHistory() {
      const container = document.getElementById('releases');
      try {
        const response = await fetch('/api/releases');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const releases = await response.json();
        container.textContent = '';
        if (!releases.length) {
          const empty = document.createElement('p');
          empty.className = 'empty';
          empty.textContent = '暂无发布记录。';
          container.append(empty);
          return;
        }
        for (const release of releases) {
          const card = document.createElement('article');
          card.className = 'release-card';
          const title = document.createElement('h3');
          title.textContent = `发布计数 ${release.published_count}`;
          const details = document.createElement('dl');
          const items = [
            ['筛选条件', describeFilters(release.filters)],
            ['ε', release.epsilon],
            ['剩余预算', release.remaining_budget],
            ['发布时间', new Date(release.created_at).toLocaleString()],
            ['request_id', release.request_id],
            ['release_id', release.release_id],
          ];
          for (const [label, value] of items) {
            const dt = document.createElement('dt');
            dt.textContent = label;
            const dd = document.createElement('dd');
            dd.textContent = value;
            details.append(dt, dd);
          }
          card.append(title, details);
          container.append(card);
        }
      } catch (error) {
        container.textContent = `发布历史暂时不可用：${error.message}`;
      }
    }

    function formatError(data, status) {
      if (data && typeof data.detail === 'string') return data.detail;
      if (data && Array.isArray(data.detail)) {
        return data.detail
          .map(item => `${(item.loc || []).filter(part => part !== 'body').join('.')}: ${item.msg}`)
          .join('；');
      }
      return `请求失败（HTTP ${status}）`;
    }

    document.getElementById('release-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('release-message');
      const button = document.getElementById('publish-button');
      const filters = {};
      for (const field of FILTER_FIELDS) {
        const value = document.getElementById(`filter-${field}`).value.trim();
        if (value) filters[field] = value;
      }
      const payload = {
        request_id: document.getElementById('request-id').value.trim(),
        dataset_id: 'retail-demo',
        filters: Object.keys(filters).length ? filters : null,
        epsilon: parseFloat(document.getElementById('epsilon').value),
      };
      message.className = '';
      message.textContent = '';
      button.disabled = true;
      try {
        const response = await fetch('/api/releases', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json().catch(() => null);
        if (!response.ok) {
          message.className = 'error';
          message.textContent = `发布失败：${formatError(data, response.status)}`;
          return;
        }
        message.className = 'success';
        message.textContent = `已发布计数 ${data.published_count}（剩余预算 ${data.remaining_budget}）。`;
        document.getElementById('request-id').value = newRequestId();
        await Promise.all([refreshBudget(), refreshHistory()]);
      } catch (error) {
        message.className = 'error';
        message.textContent = `发布失败：${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('request-id').value = newRequestId();
    loadCatalog();
    refreshBudget();
    refreshHistory();
  </script>
</body>
</html>
